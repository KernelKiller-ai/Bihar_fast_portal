name: BiharFast 3x Daily Scraper

on:
  schedule:
    # UTC time: 02:30 UTC = 8:00 AM IST
    - cron: '30 2 * * *'
    # 08:30 UTC = 2:00 PM IST
    - cron: '30 8 * * *'
    # 14:30 UTC = 8:00 PM IST
    - cron: '30 14 * * *'
  workflow_dispatch: # Manual button ke liye

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Scraper Worker
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
        run: |
          python backend/cron_worker.py