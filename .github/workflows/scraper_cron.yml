name: BiharFast All-India Scraper Engine

on:
  schedule:
    # UTC 02:30 = 08:00 AM IST
    # UTC 07:30 = 01:00 PM IST
    # UTC 13:30 = 07:00 PM IST
    - cron: '30 2,7,13 * * *'
  workflow_dispatch: # GitHub dashboard par 'Run workflow' button se manual trigger karne ke liye

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv

      - name: Run Scraper Worker
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
        run: |
          python backend/cron_worker.py