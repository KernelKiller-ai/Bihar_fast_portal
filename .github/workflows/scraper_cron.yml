name: BiharFast 3x Daily Scraper

on:
  schedule:
    # UTC 02:30 = 08:00 AM IST
    # UTC 08:30 = 02:00 PM IST
    # UTC 14:30 = 08:00 PM IST
    - cron: '30 2,8,14 * * *'
  workflow_dispatch: # GitHub dashboard se manual Run button se bhi test kar sakte hain

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv

      - name: Run Scraper Worker
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python backend/cron_worker.py